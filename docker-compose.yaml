# this is for local development only

services:
  kowloon_dependencies:
    image: kowloon
    build: .
    working_dir: /development
    volumes:
      - .:/development
    command: sh -c "npm i && (cd frontend && npm i && (test -d dist/ || npm run build))"

  mongo:
    image: mongo:8.0.4-noble
    restart: always
    healthcheck:
      test: bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/27017"
      interval: 1s
      timeout: 1s
      retries: 30
    env_file: .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_INITDB_DATABASE: kowloon
    volumes:
      - mongo:/data/db
      - ./config/mongo/init-db.js:/docker-entrypoint-initdb.d/init-db.js:ro

  kowloon:
    image: kowloon
    build: .
    depends_on:
      mongo:
        condition: service_healthy
      kowloon_dependencies:
        condition: service_completed_successfully
    healthcheck:
      test: nc -vz 127.0.0.1 3000
      interval: 1s
      timeout: 1s
      retries: 30
    deploy:
      replicas: ${REPLICAS-1}
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:?}:${MONGO_PASSWORD:?}@mongo:27017/kowloon
    working_dir: /development
    volumes:
      - .:/development
    entrypoint: ""
    command: |
      sh -c "
        instance_index=$$(nslookup $$(hostname -i) | grep name | sed -r 's|.*(-[0-9]+).*|\\1|' | tr -d '-')
        export MONGODB_URI="$$MONGODB_URI-$$instance_index"
        pm2 start -s ecosystem.config.cjs
        pm2 logs
      "

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    restart: always
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - 27117:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:?}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:?}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER?}:${MONGO_ROOT_PASSWORD:?}@mongo:27017/
      ME_CONFIG_BASICAUTH: false

  nginx:
    image: nginx:alpine
    depends_on:
      kowloon:
        condition: service_healthy
    env_file: .env
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./config/nginx/start.sh:/start.sh:ro
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/nginx/ssl:/etc/nginx/ssl
    command: /start.sh


volumes:
  mongo:
